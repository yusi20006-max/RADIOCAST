name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Install Capacitor packages explicitly
      run: npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save --legacy-peer-deps

    - name: Build Web App
      run: node node_modules/.bin/vite build

    - name: Create Capacitor Config
      run: |
        cat << 'EOF' > capacitor.config.json
        {
          "appId": "com.radiocast.app",
          "appName": "Radiocast",
          "webDir": "dist",
          "bundledWebRuntime": false
        }
        EOF

    - name: Add Android Platform & Sync
      run: |
        npx cap telemetry off || true
        npx cap add android --no-interactive
        npx cap sync android

    - name: Build Android APK
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: radiocast-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
